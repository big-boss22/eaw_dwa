 azir_entice_more_mercenaries:0 "Entice More Mercenaries"
 azir_entice_more_mercenaries_desc:0 "It's all well and good that we \"own\" this lump of desert, we need the ponies to rule it. Thankfully, we have plenty of old friends to help with that."
 azir_guns_of_the_nightmare:0 "Guns of The Nightmare"
 azir_guns_of_the_nightmare_desc:0 "Describe this focus."
 azir_intergration_efforts:0 "Intergration Efforts"
