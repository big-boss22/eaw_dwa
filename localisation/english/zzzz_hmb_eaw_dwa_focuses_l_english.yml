l_english:
 azir_a_guns_a_gun:0 "A Gun's a Gun"
 azir_a_guns_a_gun_desc:0 "We need more guns, and we need less ponies complaining about the quality of the damned things, a gun is a gun at the end of the day."
 azir_a_trucks_a_truck:0 "A Truck's a Truck"
 azir_a_trucks_a_truck_desc:0 "Trucks have rapidly become vital to all we do, after all, this shithole desert has no damned railways and until we fix that, trucks are all we have"
 azir_all_in_for_the_money:0 "All in For The Money"
 azir_all_in_for_the_money_desc:0 "Money is the universal language for us mercenaries, and when that language is spoken, many flock to it's source, let's become a new source of it."
 azir_and_to_read:0 "...And to Read"
 azir_and_to_read_desc:0 "Describe this focus."
 azir_army_of_mercs:0 "An Army of Mercenaries"
 azir_army_of_mercs_desc:0 "Once a mercenary, always a mercenary, our army will be made of the finest ones at that."
 azir_beginning:0 "Desert Winds Over Azir"
 azir_beginning_desc:0 "Desert winds blow over the desert... Who'd have thought?"
 azir_contact_the_tribes:0 "Contact the Tribes"
 azir_contact_the_tribes_desc:0 "Describe this focus."
 azir_desert_Imjahden:0 "Desert Imjahden"
