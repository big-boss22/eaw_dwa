 azir_local_gunsmith_lodges:0 "Local Gunsmith Lodges"
 azir_local_gunsmith_lodges_desc:0 "Large scale production isn't entirely viable out here in the desert, but we can at the very least get the ball rolling on it."
 azir_manufacturers_guilds:0 "Manufacturer's Guilds"
 azir_manufacturers_guilds_desc:0 "The smaller, localised, gunsmith lodges are disorganised, we need to form something to provide oversight, a guild of firearms manufacturers will do the job."
 azir_mercenary_standards_board:0 "Mercenary Standards Board"
 azir_mercenary_standards_board_desc:0 "We may be mercenaries, but we have standards, ones which at present aren't being upheld, time to form an organisation to handle that."
